apiVersion: apps/v1
kind: Deployment
metadata:
  name: d-webapp
  labels:
    app: d-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d-webapp
  template:
    metadata:
      labels:
        app: d-webapp
    spec:
      containers:
        - name: webapp
          image: nginxdemos/hello:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: d-webapp
spec:
  type: LoadBalancer
  selector:
    app: d-webapp
  ports:
    - port: 80
      targetPort: 80
